services:
  brokeify:
    build: https://github.com/Mr-Nickey/brokeify.git#main
    container_name: brokeify
    restart: unless-stopped
    # Host Port 3487 -> Container Port 3000
    # 3487 is intentionally chosen so it never collides with common homelab ports
    # (3000 Grafana/UptimeKuma, 5001 Dockge, 5030 slskd, 8080 qBittorrent, 8096 Jellyfin, 4533 Navidrome)
    ports:
      - "3487:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
