services:
  brokeify:
    build: .
    image: ghcr.io/mr-nickey/brokeify:latest
    container_name: brokeify
    restart: unless-stopped
    ports:
      - "${PORT:-3487}:3487"
    environment:
      - NODE_ENV=production
      - PORT=3487
      - DATA_DIR=/data
      - MUSIC_DIR=/music
      - BROKEIFY_DATA_DIR=/data
      - BROKEIFY_MUSIC_DIR=/music
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - JWT_SECRET=${JWT_SECRET:-}
      # Optional External Downloader & Scrobbler Integrations:
      - SLSKD_URL=${SLSKD_URL:-}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - LISTENBRAINZ_USER=${LISTENBRAINZ_USER:-}
      - LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN:-}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - STAGING_DIR=${STAGING_DIR:-/music/_inbox}
    volumes:
      # Persistent SQLite database (/data/brokeify.db), JWT secret, and extracted album cover cache
      - ./data:/data
      # Mount your local music collection read-write so Brokeify can organize files, write tags, and embed cover art
      - /path/to/your/music:/music

