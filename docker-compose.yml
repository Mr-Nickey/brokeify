services:
  brokeify:
    build: https://github.com/Mr-Nickey/brokeify.git#main
    container_name: brokeify
    restart: unless-stopped
    # Port 3487 both inside and outside the container so it never collides with
    # Port 3000 (Open WebUI, Grafana, UptimeKuma), 5001 (Dockge), 5030 (slskd), or 8096 (Jellyfin)
    ports:
      - "3487:3487"
    environment:
      - NODE_ENV=production
      - PORT=3487
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
